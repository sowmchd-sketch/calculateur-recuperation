
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon espace de concentration</title>
<style>
:root {
  --sage: #78a78f;
  --purple: #b5a1d4;
  --dark: #263d34;
  --muted: #728078;
  --soft: #f0f5f1;
  --border: #e2eae4;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 8px;
  font-family: system-ui, -apple-system, sans-serif;
  color: var(--dark);
  background: transparent;
}
.widget {
  width: 100%;
  max-width: 460px;
  margin: auto;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: white;
}
header {
  display: flex;
  align-items: center;
  gap: 10px;
}
.symbol {
  padding: 9px;
  border-radius: 11px;
  background: var(--soft);
  font-size: 20px;
}
h1 { margin: 0; font-size: 17px; }
.subtitle {
  color: var(--muted);
  font-size: 11px;
  margin-top: 3px;
}
.tabs {
  display: flex;
  gap: 5px;
  padding: 4px;
  margin-top: 16px;
  background: var(--soft);
  border-radius: 12px;
}
.tab {
  flex: 1;
  padding: 9px 5px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  font-weight: 650;
  cursor: pointer;
}
.tab.active {
  background: white;
  color: var(--dark);
  box-shadow: 0 1px 4px #263d3414;
}
.dial {
  position: relative;
  width: 180px;
  height: 180px;
  margin: 16px auto;
}
.dial svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}
.dial circle {
  fill: none;
  stroke-width: 13;
}
.track { stroke: #e9efeb; }
.progress {
  stroke: var(--sage);
  stroke-linecap: round;
  stroke-dasharray: 603.19;
  stroke-dashoffset: 0;
  transition: stroke-dashoffset .3s linear, stroke .2s;
}
.dial-content {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.eyebrow {
  font-size: 10px;
  letter-spacing: .7px;
  color: var(--muted);
}
.result {
  font-size: 34px;
  font-weight: 750;
  margin: 7px 0;
  font-variant-numeric: tabular-nums;
}
.status {
  font-size: 11px;
  color: var(--muted);
}
.actions {
  display: flex;
  justify-content: center;
  gap: 10px;
}
.action {
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: white;
  color: var(--dark);
  font-size: 12px;
  font-weight: 650;
  cursor: pointer;
}
.primary {
  background: var(--sage);
  border-color: var(--sage);
  color: white;
}
.panel {
  margin-top: 18px;
  padding: 13px;
  border-radius: 13px;
  background: var(--soft);
}
.line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.line strong { font-size: 12px; }
.controls {
  display: flex;
  align-items: center;
  gap: 7px;
}
.controls button {
  width: 28px;
  height: 28px;
  border: 1px solid #d7e4da;
  border-radius: 8px;
  background: white;
  color: var(--dark);
  font-size: 17px;
  cursor: pointer;
}
.controls button:disabled {
  opacity: .35;
  cursor: default;
}
.amount {
  min-width: 43px;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
}
.separator {
  height: 1px;
  margin: 12px 0;
  background: #dce7df;
}
.note {
  margin: 13px 0 0;
  text-align: center;
  font-size: 10px;
  color: var(--muted);
  line-height: 1.5;
}
@media (max-width: 330px) {
  .widget { padding: 11px; }
  h1 { font-size: 15px; }
  .line { flex-wrap: wrap; }
}
</style>
</head>
<body>
<main class="widget">
  <header>
    <div class="symbol">⏱️</div>
    <div>
      <h1>Mon espace de concentration</h1>
      <div class="subtitle">Pomodoro • Travail & pauses</div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" id="focusTab">
      🧠 Concentration
    </button>
    <button class="tab" id="breakTab">
      🌿 Pause
    </button>
  </div>

  <div class="dial">
    <svg viewBox="0 0 240 240" aria-hidden="true">
      <circle class="track" cx="120" cy="120" r="96"></circle>
      <circle class="progress" id="progress"
        cx="120" cy="120" r="96"></circle>
    </svg>
    <div class="dial-content" aria-live="off">
      <span class="eyebrow" id="modeLabel">
        CONCENTRATION
      </span>
      <span class="result" id="clock">25:00</span>
      <span class="status" id="status">
        Prêt à démarrer
      </span>
    </div>
  </div>

  <div class="actions">
    <button class="action primary" id="start">
      ▶ Démarrer
    </button>
    <button class="action" id="reset">
      ↺ Réinitialiser
    </button>
  </div>

  <section class="panel">
    <div class="line">
      <div>
        <strong>Durée de concentration</strong>
        <div class="subtitle">Par tranche de 5 min</div>
      </div>
      <div class="controls">
        <button id="focusMinus" aria-label="Réduire la concentration">−</button>
        <span class="amount" id="focusValue">25 min</span>
        <button id="focusPlus" aria-label="Augmenter la concentration">+</button>
      </div>
    </div>
    <div class="separator"></div>
    <div class="line">
      <div>
        <strong>Durée de pause</strong>
        <div class="subtitle">Par tranche de 5 min</div>
      </div>
      <div class="controls">
        <button id="breakMinus" aria-label="Réduire la pause">−</button>
        <span class="amount" id="breakValue">5 min</span>
        <button id="breakPlus" aria-label="Augmenter la pause">+</button>
      </div>
    </div>
  </section>

  <p class="note">
    Alterne concentration et pauses à ton rythme.
    Le minuteur ne change pas automatiquement de session.
  </p>
</main>

<script>
const $ = id => document.getElementById(id);

let focusMinutes = 25;
let breakMinutes = 5;
let mode = "focus";
let remaining = focusMinutes * 60;
let running = false;
let deadline = null;
let interval = null;
let audioContext = null;

const circumference = 2 * Math.PI * 96;

function totalSeconds() {
  return (mode === "focus" ? focusMinutes : breakMinutes) * 60;
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return String(m).padStart(2, "0") + ":" +
         String(s).padStart(2, "0");
}

function render() {
  $("clock").textContent = formatTime(remaining);
  $("modeLabel").textContent =
    mode === "focus" ? "CONCENTRATION" : "PAUSE";
  $("focusValue").textContent = focusMinutes + " min";
  $("breakValue").textContent = breakMinutes + " min";

  $("focusTab").classList.toggle("active", mode === "focus");
  $("breakTab").classList.toggle("active", mode === "break");

  $("start").textContent = running ? "⏸ Pause" : "▶ Démarrer";

  $("status").textContent =
    running ? "En cours" :
    remaining === 0 ? "Session terminée" :
    remaining < totalSeconds() ? "En pause" :
    "Prêt à démarrer";

  const progress = totalSeconds() > 0
    ? remaining / totalSeconds() : 0;

  $("progress").style.strokeDashoffset =
    circumference * (1 - progress);

  $("progress").style.stroke =
    mode === "focus" ? "#78a78f" : "#b5a1d4";

  $("focusMinus").disabled = focusMinutes <= 5;
  $("focusPlus").disabled = focusMinutes >= 90;
  $("breakMinus").disabled = breakMinutes <= 5;
  $("breakPlus").disabled = breakMinutes >= 30;

  document.title = formatTime(remaining) + " • Pomodoro";
}

function stopTimer() {
  running = false;
  deadline = null;
  clearInterval(interval);
  interval = null;
}

function playSound() {
  try {
    const ctx = audioContext;
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume();

    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();
    oscillator.type = "sine";
    oscillator.frequency.value = 660;
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      0.001, ctx.currentTime + 0.35
    );
    oscillator.connect(gain);
    gain.connect(ctx.destination);
    oscillator.start();
    oscillator.stop(ctx.currentTime + 0.35);
  } catch (e) {
    // Le son peut être bloqué par le navigateur.
  }
}

function tick() {
  if (!running) return;

  remaining = Math.max(
    0, Math.ceil((deadline - Date.now()) / 1000)
  );

  if (remaining === 0) {
    stopTimer();
    playSound();
  }
  render();
}

$("start").addEventListener("click", () => {
  if (running) {
    tick();
    stopTimer();
  } else {
    if (remaining === 0) remaining = totalSeconds();

    try {
      const AudioCtor =
        window.AudioContext || window.webkitAudioContext;
      if (AudioCtor && !audioContext) {
        audioContext = new AudioCtor();
      }
      if (audioContext?.state === "suspended") {
        audioContext.resume();
      }
    } catch (e) {}

    deadline = Date.now() + remaining * 1000;
    running = true;
    interval = setInterval(tick, 250);
  }
  render();
});

$("reset").addEventListener("click", () => {
  stopTimer();
  remaining = totalSeconds();
  render();
});

function changeMode(nextMode) {
  stopTimer();
  mode = nextMode;
  remaining = totalSeconds();
  render();
}

$("focusTab").addEventListener("click", () =>
  changeMode("focus")
);
$("breakTab").addEventListener("click", () =>
  changeMode("break")
);

function adjust(which, delta) {
  stopTimer();
  if (which === "focus") {
    focusMinutes = Math.max(
      5, Math.min(90, focusMinutes + delta)
    );
  } else {
    breakMinutes = Math.max(
      5, Math.min(30, breakMinutes + delta)
    );
  }
  remaining = totalSeconds();
  render();
}

$("focusMinus").addEventListener("click", () =>
  adjust("focus", -5)
);
$("focusPlus").addEventListener("click", () =>
  adjust("focus", 5)
);
$("breakMinus").addEventListener("click", () =>
  adjust("break", -5)
);
$("breakPlus").addEventListener("click", () =>
  adjust("break", 5)
);

render();
</script>
</body>
</html>
